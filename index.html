<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✦ hopping ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="hopping-logo.png" />
</head>
<body>

<header>
  <div class="logo">✦ h<span>opping</span> ✦</div>
  <div class="header-actions">
    <div class="total-row">
      <span id="totalCount">0 items</span>
      <span class="total-price" id="totalPrice"></span>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Add Item</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-label">Boards</div>
    <div id="boardList"></div>
    <div class="add-board-row">
      <input class="add-board-input" id="newBoardInput" placeholder="New board…" maxlength="30"
        onkeydown="if(event.key==='Enter') addBoard()" />
      <button class="btn btn-icon" onclick="addBoard()" title="Add board">＋</button>
    </div>
  </aside>

  <main>
    <div class="section-header">
      <div class="section-title" id="sectionTitle">All Items</div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Wanted</button>
        <button class="filter-btn" onclick="setFilter('purchased', this)">Purchased</button>
      </div>
    </div>
    <div class="items-grid" id="itemsGrid"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-title">Add to Wishlist</div>

    <div class="form-group">
      <label class="form-label">Product URL</label>
      <div class="url-row">
        <input class="form-input" id="inputUrl" placeholder="https://..." onpaste="onUrlPaste()" />
        <button class="btn btn-ghost" onclick="fetchMeta()">Fetch</button>
      </div>
      <div class="fetch-status" id="fetchStatus"></div>
    </div>

    <img id="previewImg" class="preview-image" style="display:none" />

    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="form-input" id="inputTitle" placeholder="Product name" />
    </div>

    <div class="form-group">
      <label class="form-label">Price</label>
      <input class="form-input" id="inputPrice" placeholder="$0.00" />
    </div>

    <div class="form-group">
      <label class="form-label">Board</label>
      <select class="form-select" id="inputBoard"></select>
    </div>

    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea class="form-textarea" id="inputNotes" placeholder="Size, color, why you love it…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()">Save ✦</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="helpers.js"></script>
</body>
</html>
